[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
greatheights-core = { path = "crates/core" }
greatheights-providers = { path = "crates/providers" }
greatheights-ai = { path = "crates/ai" }

# `runtime_shaders` compiles Metal shaders at startup, so building on macOS
# only needs the Command Line Tools rather than a full Xcode install.
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
agent-client-protocol = { version = "3.6", features = ["process"] }
async-channel = "2"
async-io = "2"
futures = "0.3"
dirs = "6"
global-hotkey = "0.9"
log = "0.4"
env_logger = "0.11"
fend-core = "1.5"
nucleo-matcher = "0.3"
objc2 = "0.6"
pulldown-cmark = { version = "0.13", default-features = false }
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1"
ureq = "3"
